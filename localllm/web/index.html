<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UltraRun · Local chat</title>
  <link rel="stylesheet" href="/chat-ui.css">
  <script defer src="/markdown-it.min.js"></script>
  <script defer src="/chat-ui.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">›_</span>
        <div>
          <strong>UltraRun</strong>
          <span id="model">Qwen3.8-27B</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="connection" id="connection" role="status">Connecting</span>
        <button class="secondary" id="reset" type="button">New chat</button>
      </div>
    </div>
  </header>
  <main>
    <section class="transcript" id="transcript" aria-label="Chat transcript">
      <div class="conversation">
        <div class="welcome" id="welcome">
          <h1>Local chat</h1>
          <p>Responses stream as they’re generated, with support for Markdown tables, code blocks, and HTML previews.</p>
          <button class="secondary" id="example" type="button">Try a Markdown example</button>
        </div>
        <div id="messages"></div>
      </div>
    </section>
    <div class="composer-area">
      <form id="composer">
        <textarea id="prompt" rows="2" placeholder="Message Qwen" aria-label="Message" required></textarea>
        <div class="composer-controls">
          <label for="limit">Max output tokens <input id="limit" type="number" min="1" step="1" value="1024" required></label>
          <span class="keyhint">Enter to send · Shift+Enter for a new line</span>
          <button class="primary" id="send" type="submit">Send</button>
        </div>
      </form>
      <div id="notice" role="status" aria-live="polite"></div>
    </div>
  </main>
</body>
</html>
